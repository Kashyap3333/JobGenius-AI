spring.application.name=jobmatcher_backend

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# NVIDIA NIM
# ===============================
nvidia.nim.api.key=${NVIDIA_API_KEY}
nvidia.nim.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.nim.model=nvidia/nemotron-3.5-bolt-e4b
nvidia.nim.max.tokens=1024

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

file.upload-dir=uploads/resumes
file.profile-image-dir=uploads/profile-images

# ===============================
# Application URLs
# ===============================
app.base-url=${APP_BASE_URL}
app.frontend.url=${FRONTEND_URL}

# ===============================
# ATS Scoring Weights
# ===============================
ats.weight.skills=60
ats.weight.experience=20
ats.weight.projects=10
ats.weight.strength=10

# ===============================
# Gmail SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# App Branding
# ===============================
app.mail.from=${MAIL_USERNAME}
app.mail.from-name=JobGenius